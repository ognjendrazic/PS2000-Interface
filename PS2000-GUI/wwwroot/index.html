<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS2000 Control</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header class="top">
    <div class="logo">PS</div>
    <div>
      <h1>PS2000 Control</h1>
      <p class="subtitle">Bench power supply dashboard</p>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="card">
    <h2>Device</h2>
    <dl>
      <dt>Make</dt>           <dd id="make">—</dd>
      <dt>Model</dt>          <dd id="model">—</dd>
      <dt>Serial number</dt>  <dd id="serial">—</dd>
      <dt>Article number</dt> <dd id="article">—</dd>
      <dt>Max voltage</dt>    <dd id="maxVoltage">—</dd>
      <dt>Current voltage</dt><dd id="currentVoltage">—</dd>
    </dl>
  </section>

  <section class="card">
    <h2>Control</h2>
    <div class="row">
      <label for="remote">Remote control<span class="row-hint">Hand off control to this interface</span></label>
      <span class="switch"><input type="checkbox" id="remote"><span></span></span>
    </div>
    <div class="row">
      <label for="output">Power output<span class="row-hint">Enable the output terminals</span></label>
      <span class="switch"><input type="checkbox" id="output"><span></span></span>
    </div>
  </section>

  <section class="card">
    <h2>Voltage</h2>
    <div class="voltage">
      <span class="voltage-input">
        <input type="number" id="setVoltage" step="0.01" min="0" placeholder="0.00" aria-label="Voltage in volts">
        <span class="unit">V</span>
      </span>
      <button class="primary" id="setBtn">Set</button>
      <button id="getBtn">Get</button>
    </div>
  </section>
</main>
<script>
  const deviceFields = ['make', 'model', 'serial', 'article', 'maxVoltage', 'currentVoltage'];

  // POSTs a command. The PSU applies it asynchronously, so use Get to read the new value.
  async function post(url) {
    const r = await fetch(url, { method: 'POST' });
    if (!r.ok) alert((await r.json()).error);
    return r.ok;
  }

  function loadDevice() {
    fetch('/api/device')
      .then(r => r.json())
      .then(d => {
        for (const id of deviceFields) {
          document.getElementById(id).textContent = d[id] ?? '—';
        }
      });
  }

  // Every 2 seconds: show whether the PSU is online and the last error it reported.
  let wasOnline = false;
  function updateStatus() {
    fetch('/api/status')
      .then(r => r.json())
      .then(s => {
        const banner = document.getElementById('banner');
        banner.hidden = s.online && !s.error;
        banner.textContent = s.online ? `PSU error: ${s.error}` : 'PSU client is offline';
        if (s.online && !wasOnline) loadDevice();
        wasOnline = s.online;
      });
  }
  updateStatus();
  setInterval(updateStatus, 2000);

  document.getElementById('output').addEventListener('change', async e => {
    if (!await post(`/api/output/${e.target.checked}`)) e.target.checked = !e.target.checked;
  });

  document.getElementById('remote').addEventListener('change', async e => {
    if (!await post(`/api/remote/${e.target.checked}`)) e.target.checked = !e.target.checked;
  });

  document.getElementById('getBtn').addEventListener('click', () => {
    fetch('/api/voltage')
      .then(r => r.json())
      .then(d => {
        document.getElementById('setVoltage').value = d.volts.toFixed(2);
        document.getElementById('currentVoltage').textContent = `${d.volts.toFixed(2)} V`;
      });
  });

  document.getElementById('setBtn').addEventListener('click', () => {
    post(`/api/voltage/${document.getElementById('setVoltage').value}`);
  });
</script>
</body>
</html>
