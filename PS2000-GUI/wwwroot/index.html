<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS2000 Control</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header class="top">
    <div class="logo">PS</div>
    <div>
      <h1>PS2000 Control</h1>
      <p class="subtitle">Bench power supply dashboard</p>
    </div>
  </header>

  <section class="card">
    <h2>Device</h2>
    <dl>
      <dt>Make</dt>           <dd id="make">—</dd>
      <dt>Model</dt>          <dd id="model">—</dd>
      <dt>Serial number</dt>  <dd id="serial">—</dd>
      <dt>Article number</dt> <dd id="article">—</dd>
      <dt>Max voltage</dt>    <dd id="maxVoltage">—</dd>
      <dt>Current voltage</dt><dd id="currentVoltage">—</dd>
    </dl>
  </section>

  <section class="card">
    <h2>Control</h2>
    <div class="row">
      <label for="remote">Remote control<span class="row-hint">Hand off control to this interface</span></label>
      <span class="switch"><input type="checkbox" id="remote"><span></span></span>
    </div>
    <div class="row">
      <label for="output">Power output<span class="row-hint">Enable the output terminals</span></label>
      <span class="switch"><input type="checkbox" id="output"><span></span></span>
    </div>
  </section>

  <section class="card">
    <h2>Voltage</h2>
    <div class="voltage">
      <span class="voltage-input">
        <input type="number" id="setVoltage" step="0.01" min="0" placeholder="0.00" aria-label="Voltage in volts">
        <span class="unit">V</span>
      </span>
      <button class="primary" id="setBtn">Set</button>
      <button id="getBtn">Get</button>
    </div>
  </section>
</main>
<script>
  fetch('/api/device')
    .then(r => r.json())
    .then(d => {
      document.getElementById('make').textContent = d.make;
      document.getElementById('model').textContent = d.model;
      document.getElementById('serial').textContent = d.serial;
      document.getElementById('article').textContent = d.article;
      document.getElementById('maxVoltage').textContent = d.maxVoltage;
      document.getElementById('currentVoltage').textContent = d.currentVoltage;
    })
    .catch(() => {
      for (const id of ['make', 'model', 'serial', 'article', 'maxVoltage', 'currentVoltage']) {
        document.getElementById(id).textContent = 'Error';
      }
    });

  document.getElementById('output').addEventListener('change', e => {
    fetch(`/api/output/${e.target.checked}`, { method: 'POST' });
  });

  document.getElementById('remote').addEventListener('change', e => {
    fetch(`/api/remote/${e.target.checked}`, { method: 'POST' });
  });

  document.getElementById('getBtn').addEventListener('click', () => {
    fetch('/api/voltage')
      .then(r => r.json())
      .then(d => {
        document.getElementById('setVoltage').value = d.volts.toFixed(2);
        document.getElementById('currentVoltage').textContent = `${d.volts.toFixed(2)} V`;
      });
  });

  document.getElementById('setBtn').addEventListener('click', () => {
    const volts = document.getElementById('setVoltage').value;
    fetch(`/api/voltage/${volts}`, { method: 'POST' })
      .then(r => r.json())
      .then(d => {
        document.getElementById('currentVoltage').textContent = `${d.volts.toFixed(2)} V`;
      });
  });
</script>
</body>
</html>
