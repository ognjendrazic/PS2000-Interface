<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS2000 Control</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c1f24; --muted: #6b7280;
    --border: #d9dce1; --accent: #2563eb; --accent-text: #ffffff; --on: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1e2126; --text: #e6e8eb; --muted: #9aa1ab;
      --border: #333841; --accent: #3b82f6; --accent-text: #ffffff; --on: #22c55e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  h2 { margin: 0 0 12px; font-size: 1rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 24px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
  .row + .row { border-top: 1px solid var(--border); }
  .voltage { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=number] {
    width: 8rem; padding: 8px 10px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  }
  button {
    padding: 8px 16px; font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .switch { position: relative; width: 46px; height: 26px; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; }
  .switch span { position: absolute; inset: 0; background: var(--border); border-radius: 26px; transition: background .15s; pointer-events: none; }
  .switch span::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    background: #fff; border-radius: 50%; transition: transform .15s;
  }
  .switch input:checked + span { background: var(--on); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>PS2000 Control</h1>
  </header>

  <section class="card">
    <h2>Device</h2>
    <dl>
      <dt>Make</dt>           <dd id="make">—</dd>
      <dt>Model</dt>          <dd id="model">—</dd>
      <dt>Serial number</dt>  <dd id="serial">—</dd>
      <dt>Article number</dt> <dd id="article">—</dd>
      <dt>Max voltage</dt>    <dd id="maxVoltage">—</dd>
      <dt>Current voltage</dt><dd id="currentVoltage">—</dd>
    </dl>
  </section>

  <section class="card">
    <h2>Control</h2>
    <div class="row">
      <label for="remote">Remote control</label>
      <span class="switch"><input type="checkbox" id="remote"><span></span></span>
    </div>
    <div class="row">
      <label for="output">Power output</label>
      <span class="switch"><input type="checkbox" id="output"><span></span></span>
    </div>
  </section>

  <section class="card">
    <h2>Voltage</h2>
    <div class="voltage">
      <input type="number" id="setVoltage" step="0.01" min="0" placeholder="0.00" aria-label="Voltage in volts">
      <span>V</span>
      <button class="primary" id="setBtn">Set</button>
      <button id="getBtn">Get</button>
    </div>
  </section>
</main>
<script>
  fetch('/api/device')
    .then(r => r.json())
    .then(d => {
      document.getElementById('make').textContent = d.make;
      document.getElementById('model').textContent = d.model;
      document.getElementById('serial').textContent = d.serial;
      document.getElementById('article').textContent = d.article;
      document.getElementById('maxVoltage').textContent = d.maxVoltage;
      document.getElementById('currentVoltage').textContent = d.currentVoltage;
    })
    .catch(() => {
      for (const id of ['make', 'model', 'serial', 'article', 'maxVoltage', 'currentVoltage']) {
        document.getElementById(id).textContent = 'Error';
      }
    });

  document.getElementById('output').addEventListener('change', e => {
    fetch(`/api/output/${e.target.checked}`, { method: 'POST' });
  });

  document.getElementById('remote').addEventListener('change', e => {
    fetch(`/api/remote/${e.target.checked}`, { method: 'POST' });
  });

  document.getElementById('getBtn').addEventListener('click', () => {
    fetch('/api/voltage')
      .then(r => r.json())
      .then(d => {
        document.getElementById('setVoltage').value = d.volts.toFixed(2);
        document.getElementById('currentVoltage').textContent = `${d.volts.toFixed(2)} V`;
      });
  });

  document.getElementById('setBtn').addEventListener('click', () => {
    const volts = document.getElementById('setVoltage').value;
    fetch(`/api/voltage/${volts}`, { method: 'POST' })
      .then(r => r.json())
      .then(d => {
        document.getElementById('currentVoltage').textContent = `${d.volts.toFixed(2)} V`;
      });
  });
</script>
</body>
</html>
